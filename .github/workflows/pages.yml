name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # posts show their commit history
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The build optimizes images with scripts/prepare-image.py.
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('content/images/**', 'scripts/prepare-image.py') }}
          restore-keys: images-
      # The build draws ```echarts and ```mermaid figures in Chrome (scripts/render-figures.py).
      - name: Cache drawn figures
        uses: actions/cache@v4
        with:
          path: |
            .cache/figures
            .cache/vendor
          key: figures-${{ hashFiles('content/posts/**', 'scripts/render-figures.py', 'templates/js/chart-theme.js', 'static/vendor/**') }}
          restore-keys: figures-
      - name: Test
        run: go test ./...
      - name: Build
        run: go run ./src
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
